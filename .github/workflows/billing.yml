name: Monthly autopay

# Once a day, asks the live site to charge monthly tuition that's due (the 1st)
# and to retry failed charges. The site does the work; this is just the alarm clock.
#
# Setup (once the site is live): add two repository secrets under
# Settings → Secrets and variables → Actions:
#   BILLING_URL   https://littlecharacters.org/api/billing/run
#   CRON_SECRET   the same value as the site's CRON_SECRET
# Until then this workflow skips itself. If a run fails, GitHub emails the repo owner.

on:
  schedule:
    - cron: '17 13 * * *' # daily, 9:17 am in Athens during daylight time (8:17 am in winter)
  workflow_dispatch:

permissions: {}

jobs:
  charge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Charge what's due
        env:
          BILLING_URL: ${{ secrets.BILLING_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BILLING_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Autopay isn't set up yet (add the BILLING_URL and CRON_SECRET secrets). Skipping."
            exit 0
          fi
          for batch in $(seq 1 100); do
            report=$(curl --fail-with-body --silent --show-error --max-time 120 -X POST \
              -H "Authorization: Bearer $CRON_SECRET" -H "Content-Type: application/json" -d '{}' "$BILLING_URL")
            echo "$report"
            [ "$(echo "$report" | jq '.remaining')" -gt 0 ] || exit 0
          done
          echo "Still charges left after 100 batches; check the site's logs."
          exit 1
